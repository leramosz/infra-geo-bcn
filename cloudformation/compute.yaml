AWSTemplateFormatVersion: "2010-09-09"
Description: BCN Geo - ECR, ECS Fargate (Spring Boot), ALB y secretos de la API

Parameters:
  NetworkStackName: {Type: String, Default: geobcn-network}
  DataStackName: {Type: String, Default: geobcn-data}
  ImageUri:
    Type: String
    Description: Imagen del back en ECR (repositorio de esta plantilla), con tag fijo.
  DesiredCount: {Type: Number, Default: 1}
  HealthCheckPath:
    Type: String
    Default: /geo-bcn/v2/openapi.yaml
    Description: Ruta que responde 200 sin autenticacion. Comprobar contra ApiAuthFilter.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration: {ScanOnPush: true}
      ImageTagMutability: IMMUTABLE

  ApiSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: API key y secreto JWT generados por CloudFormation
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: jwt_secret
        PasswordLength: 48
        ExcludePunctuation: true

  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 14}

  Cluster:
    Type: AWS::ECS::Cluster

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: "sts:AssumeRole"}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref ApiSecrets
                  - !Ref ApiKeySecret
                  - {"Fn::ImportValue": !Sub "${DataStackName}-DbSecretArn"}

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: "sts:AssumeRole"}

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-back"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: back
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 8080}]
          Environment:
            - Name: DB_URL
              Value: !Sub
                - "jdbc:postgresql://${Host}:${Port}/${Name}"
                - Host: {"Fn::ImportValue": !Sub "${DataStackName}-DbEndpoint"}
                  Port: {"Fn::ImportValue": !Sub "${DataStackName}-DbPort"}
                  Name: {"Fn::ImportValue": !Sub "${DataStackName}-DbName"}
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub
                - "${Arn}:username::"
                - Arn: {"Fn::ImportValue": !Sub "${DataStackName}-DbSecretArn"}
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - "${Arn}:password::"
                - Arn: {"Fn::ImportValue": !Sub "${DataStackName}-DbSecretArn"}
            - Name: GEOBCN_JWT_SECRET
              ValueFrom: !Sub "${ApiSecrets}:jwt_secret::"
            - Name: GEOBCN_API_KEYS
              ValueFrom: !Ref ApiKeySecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: back

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Split [",", {"Fn::ImportValue": !Sub "${NetworkStackName}-PublicSubnets"}]
      SecurityGroups: [{"Fn::ImportValue": !Sub "${NetworkStackName}-AlbSg"}]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: {"Fn::ImportValue": !Sub "${NetworkStackName}-VpcId"}
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: !Ref HealthCheckPath
      Matcher: {HttpCode: "200"}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 90
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [",", {"Fn::ImportValue": !Sub "${NetworkStackName}-PrivateSubnets"}]
          SecurityGroups: [{"Fn::ImportValue": !Sub "${NetworkStackName}-AppSg"}]
      LoadBalancers:
        - {ContainerName: back, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup}

Outputs:
  RepositoryUri: {Value: !GetAtt Repository.RepositoryUri}
  AlbDnsName: {Value: !GetAtt LoadBalancer.DNSName, Export: {Name: !Sub "${AWS::StackName}-AlbDns"}}
  ApiKeySecretArn: {Value: !Ref ApiKeySecret, Export: {Name: !Sub "${AWS::StackName}-ApiKeySecretArn"}}
