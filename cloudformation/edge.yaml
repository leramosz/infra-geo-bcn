AWSTemplateFormatVersion: "2010-09-09"
Description: BCN Geo - S3 privado + CloudFront (front estatico y /geo-bcn/v2/* hacia el ALB, mismo origen)

Parameters:
  ComputeStackName: {Type: String, Default: geobcn-compute}

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: {OriginAccessIdentity: ""}
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
          - Id: api
            DomainName: {"Fn::ImportValue": !Sub "${ComputeStackName}-AlbDns"}
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
            # CloudFront anade la API key hacia el back: el navegador nunca la ve.
            # Se lee de Secrets Manager al desplegar; no hay clave en el repo.
            OriginCustomHeaders:
              - HeaderName: X-Api-Key
                HeaderValue: !Sub
                  - "{{resolve:secretsmanager:${SecretArn}:SecretString}}"
                  - SecretArn: {"Fn::ImportValue": !Sub "${ComputeStackName}-ApiKeySecretArn"}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /geo-bcn/v2/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName: {Value: !Ref SiteBucket}
  DistributionDomain: {Value: !GetAtt Distribution.DomainName}
