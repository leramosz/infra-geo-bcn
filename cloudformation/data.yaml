AWSTemplateFormatVersion: "2010-09-09"
Description: BCN Geo - RDS PostgreSQL (PostGIS se activa con CREATE EXTENSION en la migracion V1)

Parameters:
  NetworkStackName: {Type: String, Default: geobcn-network}
  DbInstanceClass: {Type: String, Default: db.t4g.micro}
  EngineVersion:
    Type: String
    Default: "17.7"
    Description: "Verificar antes de desplegar: aws rds describe-db-engine-versions --engine postgres --query DBEngineVersions[].EngineVersion"
  DbName: {Type: String, Default: geobcn}
  DbUsername: {Type: String, Default: geobcn}
  DbSecretMode:
    Type: String
    AllowedValues: [managed, explicit]
    Default: managed
    Description: "managed = RDS crea y rota la clave (AWS real). explicit = secreto propio generado por esta plantilla (emuladores sin ManageMasterUserPassword, p. ej. Floci)."
  MultiAz:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

Rules:
  ExplicitSecretUsername:
    RuleCondition: !Equals [!Ref DbSecretMode, explicit]
    Assertions:
      - Assert: !Equals [!Ref DbUsername, geobcn]
        AssertDescription: Con DbSecretMode=explicit el usuario va fijo en la plantilla (geobcn); algunos emuladores no resuelven Sub dentro de SecretStringTemplate.

Conditions:
  UseManagedSecret: !Equals [!Ref DbSecretMode, managed]
  UseExplicitSecret: !Equals [!Ref DbSecretMode, explicit]

Resources:
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseExplicitSecret
    Properties:
      Description: Credenciales de RDS generadas por CloudFormation (modo explicit)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"geobcn"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes privadas de BCN Geo
      SubnetIds: !Split [",", {"Fn::ImportValue": !Sub "${NetworkStackName}-PrivateSubnets"}]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      ManageMasterUserPassword: !If [UseManagedSecret, true, !Ref "AWS::NoValue"]   # RDS crea y rota la clave; no hay contrasena en el repo
      MasterUserPassword: !If [UseManagedSecret, !Ref "AWS::NoValue", !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"]
      MultiAZ: !Ref MultiAz
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [{"Fn::ImportValue": !Sub "${NetworkStackName}-DbSg"}]
      BackupRetentionPeriod: 7
      DeletionProtection: false

Outputs:
  DbEndpoint: {Value: !GetAtt Database.Endpoint.Address, Export: {Name: !Sub "${AWS::StackName}-DbEndpoint"}}
  DbPort: {Value: !GetAtt Database.Endpoint.Port, Export: {Name: !Sub "${AWS::StackName}-DbPort"}}
  DbName: {Value: !Ref DbName, Export: {Name: !Sub "${AWS::StackName}-DbName"}}
  DbSecretArn: {Value: !If [UseManagedSecret, !GetAtt Database.MasterUserSecret.SecretArn, !Ref DbSecret], Export: {Name: !Sub "${AWS::StackName}-DbSecretArn"}}
