# OBSOLETA (2026-11-25): sustituida por el parámetro DbSecretMode=explicit de cloudformation/data.yaml. Se conserva solo como referencia.
AWSTemplateFormatVersion: "2010-09-09"
Description: VARIANTE de prueba en Floci (secreto explicito, sin ManageMasterUserPassword) - BCN Geo - RDS PostgreSQL (PostGIS se activa con CREATE EXTENSION en la migracion V1)

Parameters:
  NetworkStackName: {Type: String, Default: geobcn-network}
  DbInstanceClass: {Type: String, Default: db.t4g.micro}
  EngineVersion:
    Type: String
    Default: "17.7"
    Description: "Verificar antes de desplegar: aws rds describe-db-engine-versions --engine postgres --query DBEngineVersions[].EngineVersion"
  DbName: {Type: String, Default: geobcn}
  DbUsername: {Type: String, Default: geobcn}
  MultiAz:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

Resources:
  # VARIANTE: Floci no implementa MasterUserSecret; el secreto lo crea la plantilla y RDS lo lee por referencia dinamica.
  DbMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        # Floci 2.5.0 no resuelve !Sub dentro de SecretStringTemplate (genera un texto plano): usuario literal.
        SecretStringTemplate: '{"username": "geobcn"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes privadas de BCN Geo
      SubnetIds: !Split [",", {"Fn::ImportValue": !Sub "${NetworkStackName}-PrivateSubnets"}]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:password}}"
      MultiAZ: !Ref MultiAz
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [{"Fn::ImportValue": !Sub "${NetworkStackName}-DbSg"}]
      BackupRetentionPeriod: 7
      DeletionProtection: false

Outputs:
  DbEndpoint: {Value: !GetAtt Database.Endpoint.Address, Export: {Name: !Sub "${AWS::StackName}-DbEndpoint"}}
  DbPort: {Value: !GetAtt Database.Endpoint.Port, Export: {Name: !Sub "${AWS::StackName}-DbPort"}}
  DbName: {Value: !Ref DbName, Export: {Name: !Sub "${AWS::StackName}-DbName"}}
  DbSecretArn: {Value: !Ref DbMasterSecret, Export: {Name: !Sub "${AWS::StackName}-DbSecretArn"}}
